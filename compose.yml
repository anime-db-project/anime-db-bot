services:
  jikan:
    image: ${JIKAN_IMAGE:-ghcr.io/anime-db-project/anime-db-bot-jikan:${ANIME_DB_BOT_TAG:-latest}}
    container_name: anime-db-bot-Jikan
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JIKAN_PORT:-8091}:${JIKAN_PORT:-8091}"
    environment:
      JIKAN_PORT: ${JIKAN_PORT:-8091}
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$p=getenv("JIKAN_PORT") ?: "8091"; $$j=@json_decode(@file_get_contents("http://127.0.0.1:".$$p."/health"), true); exit(($$j["ok"]??false) ? 0 : 1);'
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
